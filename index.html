<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet Soda | Pure Zero Refreshment</title>
    <meta name="description" content="Experience the crisp, clean taste of Diet Soda. Zero sugar, zero compromise.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;600;700&family=Galada&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #ffffff;
            --accent-color: #ffffff;
            --muted-color: rgba(255, 255, 255, 0.75);
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.14);
            --font-main: 'Inter', sans-serif;
            --font-heading: 'Galada', cursive;
            --pink-accent: #fbcfe8;
            --dark-accent: #011d17;

            /* Dynamic Background Variables */
            --bg-inner: #0b8a78;
            --bg-mid: #044e3b;
            --bg-outer: #011411;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: radial-gradient(circle at center, var(--bg-inner) 0%, var(--bg-mid) 50%, var(--bg-outer) 100%);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        body.blue-theme {
            --bg-inner: #0b4f8a;
            --bg-mid: #04294e;
            --bg-outer: #010c14;
        }

        /* Ambient Bubbles */
        #bubbles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble-img {
            position: absolute;
            pointer-events: none;
            will-change: transform, opacity;
        }

        @keyframes floatUpImg {
            0% {
                transform: translateY(0) translateX(0) rotate(0deg);
                opacity: 0;
            }
            15% { opacity: 0.45; }
            85% { opacity: 0.45; }
            100% {
                transform: translateY(-115vh) translateX(30px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Glass Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 4.5%;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            font-size: 1.35rem;
            font-family: var(--font-heading);
            cursor: pointer;
            transition: transform 0.25s ease;
        }
        .logo:hover {
            transform: scale(1.05);
        }

        .nav {
            display: flex;
            gap: 0.4rem;
            background: var(--glass-bg);
            padding: 0.35rem;
            border-radius: 100px;
            border: 1px solid var(--glass-border);
        }

        .nav.glass {
            position: relative;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .nav-item {
            font-family: 'Manrope', sans-serif;
            color: var(--muted-color);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            padding: 0.55rem 1.3rem;
            border-radius: 100px;
            transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            cursor: pointer;
            display: inline-block;
        }

        .nav-item:hover,
        .nav-item.active {
            background: var(--pink-accent);
            color: var(--dark-accent);
            box-shadow: 0 4px 15px rgba(251, 207, 232, 0.3);
            transform: translateY(-1px);
        }

        .contact-btn {
            background: rgba(0, 0, 0, 0.55);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.85rem 2rem;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .contact-btn:hover {
            background: rgba(0, 0, 0, 0.85);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        /* Hero Layout */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4.5%;
            padding-top: 5rem;
            position: relative;
        }

        .hero-content {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Typography */
        .main-title,
        .side-title {
            font-family: var(--font-heading);
            font-size: clamp(5.2rem, 9.5vw, 11rem);
            line-height: 0.82;
            font-weight: 400;
            white-space: nowrap;
            color: white;
            letter-spacing: normal;
            text-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
        }

        .outline {
            color: var(--text-color);
        }

        /* Leaves Background Layer */
        .leaves-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            will-change: transform;
        }

        .leaf {
            position: absolute;
            width: 65px;
            height: 65px;
            pointer-events: none;
            z-index: 0;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
            will-change: transform;
        }

        .l1 { top: 12%; left: 16%; }
        .l2 { top: 38%; left: 82%; width: 140px; height: 140px; opacity: 0.45; }
        .l3 { top: 72%; left: 74%; width: 85px; height: 85px; }
        .l4 { top: 84%; left: 22%; width: 125px; height: 125px; opacity: 0.35; }

        /* Left Column */
        .hero-left {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 5.5rem 0 3.5rem 0;
            gap: 1.8rem;
            z-index: 10;
            max-width: 440px;
        }

        .description {
            color: var(--muted-color);
            font-size: 1.08rem;
            line-height: 1.65;
            font-weight: 400;
            max-width: 380px;
        }

        .primary-btn {
            display: inline-flex;
            align-items: center;
            gap: 1.4rem;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.45rem 0.5rem 0.45rem 1.6rem;
            border-radius: 100px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: fit-content;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            backdrop-filter: blur(10px);
        }

        .primary-btn:hover {
            background: rgba(0, 0, 0, 0.85);
            border-color: rgba(251, 207, 232, 0.5);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
        }

        .plus-icon {
            background: var(--pink-accent);
            color: var(--dark-accent);
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1.4rem;
            font-weight: 900;
            line-height: 1;
            padding-bottom: 2px;
            transition: transform 0.3s ease;
        }

        .primary-btn:hover .plus-icon {
            transform: rotate(90deg);
        }

        .award-badge {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-top: auto;
            cursor: pointer;
            padding: 0.5rem 0.8rem;
            border-radius: 16px;
            width: fit-content;
            transition: background 0.3s ease, transform 0.25s ease;
        }
        .award-badge:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .award-icon {
            width: 48px;
            height: 48px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--pink-accent);
        }

        .award-text { display: flex; flex-direction: column; }
        .award-title { font-size: 0.72rem; letter-spacing: 0.12em; color: var(--muted-color); font-weight: 600; }
        .award-subtitle { font-size: 0.88rem; font-weight: 700; color: white; }

        /* Berries Container Layers */
        .berries-container-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            will-change: transform;
        }

        .berries-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
            will-change: transform;
        }

        .berry {
            position: absolute;
            width: 120px;
            height: 120px;
            outline: none;
            --progress-bar-color: transparent;
            filter: drop-shadow(0 10px 25px rgba(0, 0, 0, 0.35));
            will-change: transform;
        }

        .b1 { top: 25%; left: 30%; width: 220px; height: 220px; }
        .b2 { top: 60%; left: 42%; width: 100px; height: 100px; }
        .b3 { top: 30%; left: 62%; width: 250px; height: 250px; }
        .b4 { top: 15%; left: 48%; width: 140px; height: 140px; }
        .b5 { top: 75%; left: 20%; width: 120px; height: 120px; }
        .b6 { top: 45%; left: 75%; width: 180px; height: 180px; }
        .b7 { top: 15%; left: 40%; width: 80px; height: 80px; opacity: 0.75; }
        .b8 { top: 50%; left: 55%; width: 70px; height: 70px; opacity: 0.65; }
        .b9 { top: 80%; left: 35%; width: 75px; height: 75px; opacity: 0.75; }

        /* Center Can Layer */
        .hero-center {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            opacity: 0;
            animation: fadeIn 1.5s ease-out 0.3s forwards, float 6s ease-in-out infinite;
            pointer-events: none;
            background: radial-gradient(circle at center, rgba(16, 185, 129, 0.12) 0%, transparent 65%);
        }

        @keyframes fadeIn { to { opacity: 1; } }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }

        .main-product-3d {
            width: 80vw;
            height: 80vh;
            outline: none;
            --progress-bar-color: transparent;
            --poster-color: transparent;
            z-index: 5;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(25deg);
            pointer-events: none;
            will-change: transform, filter;
        }

        /* Right Column */
        .hero-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            text-align: right;
            height: 100%;
            padding: 5.5rem 0 3.5rem 0;
            z-index: 10;
            width: 440px;
            pointer-events: none;
        }

        .product-carousel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: flex-end;
            pointer-events: auto;
        }

        .carousel-cards { display: flex; gap: 1rem; }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 1.2rem 1rem 1rem 1rem;
            padding-top: 5.2rem;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.4rem;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 140px;
            position: relative;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            text-align: center;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.45);
            transform: translateY(-4px);
        }

        .card.active {
            border-color: var(--pink-accent);
            border-width: 1.5px;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(251, 207, 232, 0.2);
        }

        .card img {
            width: 140px;
            height: auto;
            margin-top: -8.2rem;
            filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.5));
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
            display: block;
            will-change: transform;
            pointer-events: none;
        }

        .card:hover img {
            transform: translateY(-30px) rotate(-12deg) scale(1.15) !important;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            font-size: 0.76rem;
            width: 100%;
            gap: 0.2rem;
        }

        .card-info span:first-child { font-weight: 700; color: white; }
        .card-info span:last-child { color: var(--muted-color); font-weight: 500; }

        .carousel-nav { display: flex; gap: 0.8rem; pointer-events: auto; }

        .nav-arrow {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.25s ease;
            backdrop-filter: blur(10px);
        }

        .nav-arrow:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--pink-accent);
            color: var(--pink-accent);
            transform: scale(1.1);
        }
        .nav-arrow:active {
            transform: scale(0.92);
        }

        .side-title { align-self: flex-end; text-align: right; }

        /* ================================================= */
        /* MODALS & OVERLAYS (HIGH QUALITY GLASSMORPHISM)    */
        /* ================================================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            padding: 1.5rem;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(14, 25, 23, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 2.5rem;
            width: 100%;
            max-width: 620px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.92) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            color: white;
        }

        .modal-overlay.open .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-close-btn {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close-btn:hover {
            background: var(--pink-accent);
            color: var(--dark-accent);
            transform: rotate(90deg);
        }

        .modal-title {
            font-family: var(--font-heading);
            font-size: 2.8rem;
            line-height: 1;
            margin-bottom: 0.5rem;
            color: white;
        }

        .modal-subtitle {
            color: var(--muted-color);
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        /* Modal Inner Grids & Cards */
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .feature-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .feature-box .feat-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--pink-accent);
        }

        .feature-box .feat-desc {
            font-size: 0.85rem;
            color: var(--muted-color);
            line-height: 1.4;
        }

        /* Nutrition / Stats Table */
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .stats-table tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .stats-table td {
            padding: 0.75rem 0;
            color: var(--muted-color);
        }

        .stats-table td:last-child {
            text-align: right;
            font-weight: 700;
            color: white;
        }

        /* Form Controls */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted-color);
        }

        .form-input, .form-textarea {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            color: white;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .form-input:focus, .form-textarea:focus {
            border-color: var(--pink-accent);
            background: rgba(255, 255, 255, 0.1);
        }

        .form-submit-btn {
            background: var(--pink-accent);
            color: var(--dark-accent);
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 100px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.25s ease;
        }

        .form-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(251, 207, 232, 0.4);
        }

        /* Shop / Checkout Specifics */
        .shop-preview-card {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .shop-preview-img {
            width: 80px;
            height: auto;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        .pack-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .pack-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            border-radius: 14px;
            padding: 0.8rem 0.5rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .pack-btn.selected {
            border-color: var(--pink-accent);
            background: rgba(251, 207, 232, 0.15);
            color: var(--pink-accent);
            font-weight: 700;
        }

        .qty-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .qty-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 100px;
            padding: 0.3rem 0.8rem;
        }

        .qty-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Toast feedback */
        .toast-notification {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(14, 25, 23, 0.95);
            border: 1px solid var(--pink-accent);
            color: white;
            padding: 1rem 2rem;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            z-index: 3000;
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .toast-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .main-product-3d { width: 100vw; height: 60vh; top: 40%; }
            .hero-content { flex-direction: column; padding-top: 6rem; align-items: center; }
            .hero-left, .hero-right { width: 100%; max-width: 100%; align-items: center; text-align: center; }
            .hero-left { padding: 2rem 0; gap: 1.5rem; }
            .hero-right { padding: 2rem 0; align-items: center; }
            .main-title, .side-title { font-size: 4.5rem; }

        }
    </style>
</head>
<body>

                <model-viewer class="leaf l4" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/leaves.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="10deg 45deg 105%"></model-viewer>

                <model-viewer class="berry b8" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="160deg 45deg 105%"></model-viewer>
                <model-viewer class="berry b9" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none" camera-orbit="45deg 20deg 105%"></model-viewer>

                <model-viewer class="berry b2" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="-120deg 45deg 105%"></model-viewer>
                <model-viewer class="berry b3" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="200deg 90deg 105%"></model-viewer>
                <model-viewer class="berry b4" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="10deg 20deg 105%"></model-viewer>
                <model-viewer class="berry b5" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="-45deg 160deg 105%"></model-viewer>
                <model-viewer class="berry b6" src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb" environment-image="neutral" exposure="1.2" interaction-prompt="none" camera-orbit="80deg 75deg 105%"></model-viewer>

            <!-- 3f. Right column -->
            <div class="hero-right">
                <div class="product-carousel">
                    <div class="carousel-cards">
                        <div class="card active" data-flavor="classic" id="card-classic">
                            <img src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/Green%20Soda.png" alt="Diet Classic">
                            <div class="card-info">
                                <span>Diet Classic</span>
                                <span>$2.99</span>
                            </div>
                        </div>
                        <div class="card" data-flavor="blue" id="card-blue">
                            <img src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/Blue%20Soda.png" alt="Zero Lime" style="filter: brightness(0.75);">
                            <div class="card-info">

                    Clean
                </h2>

    </main>

    <!-- Preload berry models to avoid lag during switch -->
    <div style="display: none;">
        <model-viewer src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/blueberry.glb"></model-viewer>
        <model-viewer src="https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb"></model-viewer>
    </div>

    <!-- ============================================== -->
    <!-- INTERACTIVE MODALS (COMPLETE IMPLEMENTATION)  -->
    <!-- ============================================== -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-card" id="modal-card">
            <button class="modal-close-btn" id="modal-close-btn">&times;</button>
            <div id="modal-dynamic-content"></div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast-notification">
        <span id="toast-icon">✨</span>
        <span id="toast-msg">Action completed!</span>
    </div>

    <script>
        // DOM Elements
        const modelViewer = document.querySelector('#product-model');
        const berriesFG = document.querySelector('.berries-container');
        const berriesBG = document.querySelector('.berries-container-bg');
        const leavesBG = document.querySelector('.leaves-container');
        const allBerries = document.querySelectorAll('.berry');
        const cards = document.querySelectorAll('.card');
        const prevArrow = document.getElementById('prev-flavor-btn');
        const nextArrow = document.getElementById('next-flavor-btn');
        const shopBtn = document.getElementById('shop-btn');
        const contactBtn = document.getElementById('contact-btn');
        const awardBtn = document.getElementById('award-btn');
        const navLinks = document.querySelectorAll('.nav-item');
        const logoBtn = document.getElementById('logo-btn');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-dynamic-content');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const toast = document.getElementById('toast');

        let isSwitching = false;
        let switchSpin = 0;
        let blueTexture = null;
        let greenTexture = null;
        let currentFlavor = 'classic';

        // Preload textures & Warm up shaders
        modelViewer.addEventListener('load', async () => {
            try {
                blueTexture = await modelViewer.createTexture('https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/blue%20base%20color.jpg');
                greenTexture = await modelViewer.createTexture('https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/green%20base%20color.jpg');

                // Shader Warm-up: Briefly apply textures to compile shaders
                if (modelViewer.model) {
                    const material = modelViewer.model.materials[0];
                    if (material && material.pbrMetallicRoughness.baseColorTexture) {
                        material.pbrMetallicRoughness.baseColorTexture.setTexture(blueTexture);
                        await new Promise(r => requestAnimationFrame(r));
                        material.pbrMetallicRoughness.baseColorTexture.setTexture(greenTexture);
                    }
                }
            } catch (e) {
                console.warn("Texture preload notice:", e);
            }
        });

        // 1. CAROUSEL CARDS SELECTION
        cards.forEach(card => {
            card.addEventListener('click', () => {
                if (isSwitching) return;
                const flavor = card.dataset.flavor;
                if (flavor === currentFlavor) return;
                cards.forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                currentFlavor = flavor;
                switchFlavor(flavor);
            });
        });

        // 2. CAROUSEL ARROWS INTERACTION (FIXED & WORKING)
        function toggleFlavorCycle() {
            if (isSwitching) return;
            const nextFlavor = currentFlavor === 'classic' ? 'blue' : 'classic';
            const targetCard = document.querySelector(`.card[data-flavor="${nextFlavor}"]`);
            if (targetCard) targetCard.click();
        }
        if (prevArrow) prevArrow.addEventListener('click', toggleFlavorCycle);
        if (nextArrow) nextArrow.addEventListener('click', toggleFlavorCycle);

        // FLAVOR SWITCH ANIMATION
        async function switchFlavor(flavor) {
            if (isSwitching) return;
            isSwitching = true;
            const body = document.body;
            const berries = document.querySelectorAll('.berry');
            const heroCenter = document.querySelector('.hero-center');

            // 1. Background Animation
            const targetColors = flavor === 'blue' ?
                { inner: '#0b4f8a', mid: '#04294e', outer: '#010c14' } :
                { inner: '#0b8a78', mid: '#044e3b', outer: '#011411' };

            gsap.to(body, {
                '--bg-inner': targetColors.inner,
                '--bg-mid': targetColors.mid,
                '--bg-outer': targetColors.outer,
                duration: 1.5,
                ease: 'power2.inOut'
            });

            // 2. Can Spin Animation (360 spin + blur with back settle)
            const spinObj = { val: 0, blur: 0 };
            gsap.to(spinObj, {
                val: 360,
                blur: 14,
                duration: 0.6,
                ease: "power2.in",
                onUpdate: () => {
                    switchSpin = spinObj.val;
                    modelViewer.style.filter = `blur(${spinObj.blur}px)`;
                },
                onComplete: async () => {
                    if (flavor === 'blue') {
                        body.classList.add('blue-theme');
                        if (modelViewer.model && blueTexture) {
                            modelViewer.model.materials.forEach(material => {
                                if (material.pbrMetallicRoughness.baseColorTexture) {
                                    material.pbrMetallicRoughness.baseColorTexture.setTexture(blueTexture);
                                }
                            });
                        }
                    } else {
                        body.classList.remove('blue-theme');
                        if (modelViewer.model && greenTexture) {
                            modelViewer.model.materials.forEach(material => {
                                if (material.pbrMetallicRoughness.baseColorTexture) {
                                    material.pbrMetallicRoughness.baseColorTexture.setTexture(greenTexture);
                                }
                            });
                        }
                    }

                    gsap.to(spinObj, {
                        val: 720,
                        blur: 0,
                        duration: 1.5,
                        ease: "back.out(0.7)",
                        onUpdate: () => {
                            switchSpin = spinObj.val;
                            modelViewer.style.filter = `blur(${spinObj.blur}px)`;
                        },
                        onComplete: () => {
                            switchSpin = 0;
                            modelViewer.style.filter = 'none';
                        }
                    });
                }
            });

            // 3. Berries Implode & Explode
            let completedBerries = 0;
            berries.forEach((berry) => {
                const bW = berry.offsetWidth / 2;
                const bH = berry.offsetHeight / 2;
                const centerX = (window.innerWidth / 2 - berry.offsetLeft - bW);
                const centerY = (window.innerHeight / 2 - berry.offsetTop - bH);

                const startAngle = parseFloat(berry.dataset.angle) || 0;
                const currentBaseX = parseFloat(berry.dataset.baseX) || 0;
                const currentBaseY = parseFloat(berry.dataset.baseY) || 0;

                const nextBaseX = (Math.random() - 0.5) * 200;
                const nextBaseY = (Math.random() - 0.5) * 200;

                gsap.set(berry, {
                    rotation: startAngle,
                    x: currentBaseX,
                    y: currentBaseY
                });

                const berryTl = gsap.timeline();

                berryTl.to(berry, {
                    x: centerX,
                    y: centerY,
                    rotation: startAngle + 45,
                    scale: 0.1,
                    opacity: 0,
                    duration: 0.5,
                    ease: "power2.in",
                    onComplete: () => {
                        berry.src = flavor === 'blue' ? 'https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/blueberry.glb' : 'https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/cherry.glb';
                        heroCenter.style.zIndex = 50;
                    }
                })
                .to(berry, { duration: 0.25 })
                .to(berry, {
                    onStart: () => { heroCenter.style.zIndex = 5; },
                    x: nextBaseX,
                    y: nextBaseY,
                    rotation: startAngle + 90,
                    scale: 1,
                    opacity: 1,
                    duration: 0.9,
                    ease: "back.out(1.5)",
                    onComplete: () => {
                        berry.dataset.angle = startAngle + 90;
                        berry.dataset.baseX = nextBaseX;
                        berry.dataset.baseY = nextBaseY;
                        berry.dataset.rx = 0;
                        berry.dataset.ry = 0;

                        completedBerries++;
                        if (completedBerries === berries.length) {
                            isSwitching = false;
                            updateBerryPositionsCache();
                        }
                    }
                });
            });
        }

        // ==============================================================
        // HIGH-PERFORMANCE 60-120FPS PARALLAX & REPULSION (NO REFLOW)
        // ==============================================================
        let berryCenters = [];
        function updateBerryPositionsCache() {
            berryCenters = Array.from(allBerries).map(b => {
                const r = b.getBoundingClientRect();
                return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
            });
        }
        window.addEventListener('resize', updateBerryPositionsCache);
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(updateBerryPositionsCache, 500);
        });

        allBerries.forEach(b => {
            b.dataset.rx = 0; b.dataset.ry = 0; b.dataset.angle = Math.random() * 360;
            b.dataset.baseX = 0; b.dataset.baseY = 0;
        });

        let mouse = { x: 0, y: 0, px: window.innerWidth / 2, py: window.innerHeight / 2 };
        let currentMouse = { x: 0, y: 0 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) - 0.5;
            mouse.y = (e.clientY / window.innerHeight) - 0.5;
            mouse.px = e.clientX;
            mouse.py = e.clientY;
        }, { passive: true });

        // Touch parallax support
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const t = e.touches[0];
                mouse.x = (t.clientX / window.innerWidth) - 0.5;
                mouse.y = (t.clientY / window.innerHeight) - 0.5;
                mouse.px = t.clientX;
                mouse.py = t.clientY;
            }
        }, { passive: true });

        function animate() {
            const time = Date.now() * 0.001;

            currentMouse.x += (mouse.x - currentMouse.x) * 0.06;
            currentMouse.y += (mouse.y - currentMouse.y) * 0.06;

            // Tilt 3D can + rotation
            modelViewer.cameraOrbit = `${(currentMouse.x * 38) + switchSpin}deg ${90 + (currentMouse.y * 18)}deg 380%`;

            // Parallax layers (GPU translate3d)
            berriesFG.style.transform = `translate3d(${currentMouse.x * 55}px, ${currentMouse.y * 55}px, 0)`;
            berriesBG.style.transform = `translate3d(${currentMouse.x * -28}px, ${currentMouse.y * -28}px, 0)`;
            leavesBG.style.transform = `translate3d(${currentMouse.x * -14}px, ${currentMouse.y * -14}px, 0)`;

            // High performance berry repulsion without forced reflow
            if (!isSwitching && berryCenters.length > 0) {
                for (let i = 0; i < allBerries.length; i++) {
                    const berry = allBerries[i];
                    const center = berryCenters[i] || { x: window.innerWidth / 2, y: window.innerHeight / 2 };

                    const diffX = mouse.px - center.x;
                    const diffY = mouse.py - center.y;
                    const distSq = diffX * diffX + diffY * diffY;

                    let targetRx = 0, targetRy = 0, speedMult = 1;

                    if (distSq < 160000) { // 400px radius squared
                        const distance = Math.sqrt(distSq);
                        const force = (400 - distance) / 400;
                        targetRx = (diffX / distance) * force * -75;
                        targetRy = (diffY / distance) * force * -75;
                        speedMult = 1 + force * 4.5;
                    }

                    let rx = parseFloat(berry.dataset.rx) || 0;
                    let ry = parseFloat(berry.dataset.ry) || 0;
                    let angle = parseFloat(berry.dataset.angle) || 0;
                    let baseX = parseFloat(berry.dataset.baseX) || 0;
                    let baseY = parseFloat(berry.dataset.baseY) || 0;

                    rx += (targetRx - rx) * 0.12;
                    ry += (targetRy - ry) * 0.12;
                    angle += 0.2 * speedMult;

                    berry.dataset.rx = rx;
                    berry.dataset.ry = ry;
                    berry.dataset.angle = angle;

                    const dur = [5, 7, 6, 8, 5.5, 6.5, 9, 11, 10][i % 9];
                    const phase = (time + i * 0.7) * (Math.PI * 2 / dur);
                    const floatY = Math.sin(phase) * 14;
                    const floatAngle = Math.cos(phase) * 5;

                    berry.style.transform = `translate3d(${rx + baseX}px, ${ry + baseY + floatY}px, 0) rotate(${angle + floatAngle}deg)`;
                }
            }

            // Leaves Float
            const leaves = document.querySelectorAll('.leaf');
            for (let i = 0; i < leaves.length; i++) {
                const dur = 10 + i * 2;
                const phase = (time + i * 1.2) * (Math.PI * 2 / dur);
                const floatY = Math.sin(phase) * 18;
                const floatX = Math.cos(phase * 0.5) * 14;
                const floatAngle = Math.sin(phase * 0.3) * 14;
                leaves[i].style.transform = `translate3d(${floatX}px, ${floatY}px, 0) rotate(${floatAngle}deg)`;
            }

            requestAnimationFrame(animate);
        }
        animate();

        // Optimized Bubbles Generator
        const bubblesContainer = document.getElementById('bubbles-container');
        function createBubble() {
            if (!bubblesContainer || document.hidden) return;
            if (bubblesContainer.childElementCount > 22) return; // Limit DOM load

            const bubble = document.createElement('img');
            bubble.src = 'https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/bubble.png';
            bubble.className = 'bubble-img';
            const size = Math.floor(Math.random() * 20 + 10) + 'px';
            bubble.style.width = size;
            bubble.style.height = 'auto';
            bubble.style.left = (Math.random() * 100) + '%';
            bubble.style.bottom = '-50px';
            bubble.style.opacity = (Math.random() * 0.35 + 0.2).toFixed(2);

            const duration = Math.floor(Math.random() * 5 + 5);
            bubble.style.animation = `floatUpImg ${duration}s linear forwards`;

            bubblesContainer.appendChild(bubble);
            setTimeout(() => {
                if (bubble.parentNode) bubble.remove();
            }, duration * 1000);
        }
        setInterval(createBubble, 450);

        // ==============================================
        // TOAST NOTIFICATION UTILITY
        // ==============================================
        let toastTimeout = null;
        function showToast(msg, icon = '✨') {
            if (toastTimeout) clearTimeout(toastTimeout);
            document.getElementById('toast-icon').innerText = icon;
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.add('show');
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ==============================================
        // MODALS SYSTEM (INGREDIENTS, TASTE, ECO, ETC.)
        // ==============================================
        function openModal(contentHtml) {
            modalContent.innerHTML = contentHtml;
            modalOverlay.classList.add('open');
        }

        function closeModal() {
            modalOverlay.classList.remove('open');
            // Reset active nav item to Home
            navLinks.forEach(l => l.classList.remove('active'));
            const homeLink = document.querySelector('.nav-item[data-target="home"]');
            if (homeLink) homeLink.classList.add('active');
        }

        modalCloseBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) closeModal();
        });
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // 3. NAV LINKS (INGREDIENTS, TASTE, ECO, REVIEWS, HOME)
        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                const target = link.dataset.target;
                navLinks.forEach(l => l.classList.remove('active'));
                link.classList.add('active');

                if (target === 'home') {
                    closeModal();
                    return;
                }

                if (target === 'ingredients') {
                    openModal(`
                        <h2 class="modal-title">Pure Ingredients</h2>
                        <p class="modal-subtitle">Crafted with pristine alpine spring water, pure botanicals, and zero artificial sweeteners.</p>
                        <div class="feature-grid">
                            <div class="feature-box">
                                <span class="feat-title">Alpine Spring Water</span>
                                <span class="feat-desc">Triple-filtered for absolute clarity and maximum sparkling effervescence.</span>
                            </div>
                            <div class="feature-box">
                                <span class="feat-title">Organic Fruit Essence</span>
                                <span class="feat-desc">Cold-pressed real cherry & wild lime zest extracts.</span>
                            </div>
                            <div class="feature-box">
                                <span class="feat-title">Monk Fruit & Stevia</span>
                                <span class="feat-desc">Zero glycemic index, zero calorie organic sweetness without any bitter aftertaste.</span>
                            </div>
                            <div class="feature-box">
                                <span class="feat-title">Vitamin B-Complex</span>
                                <span class="feat-desc">Infused with active B6, B12, and electrolytes for clean cellular revitalization.</span>
                            </div>
                        </div>
                        <h4 style="font-size: 0.9rem; font-weight: 700; color: var(--pink-accent); margin-bottom: 0.5rem;">NUTRITION INFORMATION (330ml Can)</h4>
                        <table class="stats-table">
                            <tr><td>Calories</td><td>0 kcal</td></tr>
                            <tr><td>Total Sugars</td><td>0 g</td></tr>
                            <tr><td>Total Fat</td><td>0 g</td></tr>
                            <tr><td>Sodium</td><td>8 mg</td></tr>
                            <tr><td>Vitamin B12</td><td>100% DV</td></tr>
                        </table>
                    `);
                } else if (target === 'taste') {
                    openModal(`
                        <h2 class="modal-title">The Flavor Experience</h2>
                        <p class="modal-subtitle">Engineered to hit the sensory peak of crisp refreshment from the first pop to the lingering finish.</p>
                        <div class="feature-grid">
                            <div class="feature-box">
                                <span class="feat-title">Instant Crisp Pop</span>
                                <span class="feat-desc">High-density micro-bubbles deliver a satisfying fizz.</span>
                            </div>
                            <div class="feature-box">
                                <span class="feat-title">Zero Aftertaste</span>
                                <span class="feat-desc">No chemical metallic lingering — clean and pure.</span>
                            </div>
                            <div class="feature-box">
                                <span class="feat-title">Diet Classic</span>
                                <span class="feat-desc">Deep botanical cherry burst with a sparkling herbal undertone.</span>
                            </div>
                            <div class="feature-box">
                                <span class="feat-title">Zero Lime</span>
                                <span class="feat-desc">Electrifying wild blueberry with a refreshing citrus snap.</span>
                            </div>
                        </div>
                        <div style="background: rgba(255,255,255,0.06); padding: 1.2rem; border-radius: 16px; border: 1px solid rgba(255,255,255,0.12); margin-top: 1rem;">
                            <div style="display:flex; justify-content:space-between; margin-bottom: 0.4rem; font-size: 0.85rem;">
                                <span>Fizz Intensity</span><span style="color:var(--pink-accent); font-weight:700;">96%</span>
                            </div>
                            <div style="height:6px; background:rgba(255,255,255,0.1); border-radius:10px; overflow:hidden; margin-bottom:0.8rem;">
                                <div style="width:96%; height:100%; background:var(--pink-accent);"></div>
                            </div>
                            <div style="display:flex; justify-content:space-between; margin-bottom: 0.4rem; font-size: 0.85rem;">
                                <span>Pure Refreshment Rating</span><span style="color:var(--pink-accent); font-weight:700;">100%</span>
                            </div>
                            <div style="height:6px; background:rgba(255,255,255,0.1); border-radius:10px; overflow:hidden;">
                                <div style="width:100%; height:100%; background:var(--pink-accent);"></div>
                            </div>
                        </div>
                    `);
                } else if (target === 'eco') {
                    openModal(`
                        <h2 class="modal-title">Eco & Planet First</h2>
                        <p class="modal-subtitle">Our commitment to sustainable packaging and a zero-waste future.</p>
                        <div class="feature-grid">
                            <div class="feature-box">
                                <span class="feat-title">100% Infinitely Recyclable</span>
                                <span class="feat-desc">Made entirely from ultra-lightweight food-grade recycled aluminum.</span>
                            </div>
                            <div class="feature-box">
                                <span class="feat-title">Zero Plastic Promise</span>
                                <span class="feat-desc">Zero plastic rings, zero plastic films. 100% biodegradable paperboard trays.</span>
                            </div>
                            <div class="feature-box">
                                <span class="feat-title">Carbon Neutral Delivery</span>
                                <span class="feat-desc">Every shipment is fully offset through certified reforestation initiatives.</span>
                            </div>
                            <div class="feature-box">
                                <span class="feat-title">Ocean Cleanup 1%</span>
                                <span class="feat-desc">1% of all gross sales directly funds marine plastic recovery missions.</span>
                            </div>
                        </div>
                    `);
                } else if (target === 'reviews') {
                    openModal(`
                        <h2 class="modal-title">Customer Reviews</h2>
                        <p class="modal-subtitle">Rated 4.9/5 from over 14,800 soda lovers worldwide.</p>
                        <div style="display:flex; flex-direction:column; gap:1rem;">
                            <div class="feature-box">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.3rem;">
                                    <span style="font-weight:700; color:white;">Sophia M.</span>
                                    <span style="color:var(--pink-accent);">★★★★★</span>
                                </div>
                                <p style="font-size:0.88rem; color:var(--muted-color); line-height:1.5;">"I never thought a zero-sugar soda could taste this incredible. The fizz is perfection and the can looks like art on my desk."</p>
                            </div>
                            <div class="feature-box">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.3rem;">
                                    <span style="font-weight:700; color:white;">Daniel K.</span>
                                    <span style="color:var(--pink-accent);">★★★★★</span>
                                </div>
                                <p style="font-size:0.88rem; color:var(--muted-color); line-height:1.5;">"Zero Lime with fresh ice is unbeatable. Replaced my afternoon energy drinks completely!"</p>
                            </div>
                            <div class="feature-box">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.3rem;">
                                    <span style="font-weight:700; color:white;">Chloe T.</span>
                                    <span style="color:var(--pink-accent);">★★★★★</span>
                                </div>
                                <p style="font-size:0.88rem; color:var(--muted-color); line-height:1.5;">"Fast shipping, sleek eco-friendly packaging, and zero aftertaste. 10/10 recommendation."</p>
                            </div>
                        </div>
                    `);
                }
            });
        });

        // 4. CONTACT US MODAL
        contactBtn.addEventListener('click', () => {
            openModal(`
                <h2 class="modal-title">Get in Touch</h2>
                <p class="modal-subtitle">Have questions or looking for retail distribution? Send our team a message.</p>
                <form id="contact-form" onsubmit="event.preventDefault(); handleContactSubmit();">
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" class="form-input" placeholder="e.g. Alex Morgan" required />
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-input" placeholder="alex@domain.com" required />
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea class="form-textarea" rows="4" placeholder="How can we assist you today?" required></textarea>
                    </div>
                    <button type="submit" class="form-submit-btn">Send Message</button>
                </form>
            `);
        });

        window.handleContactSubmit = function() {
            closeModal();
            showToast("Message sent successfully! We'll reply within 24 hours.", "📬");
        };

        // 5. SHOP NOW / CHECKOUT MODAL
        shopBtn.addEventListener('click', () => {
            const isBlue = currentFlavor === 'blue';
            const flavorName = isBlue ? 'Zero Lime (Citrus & Wild Berry)' : 'Diet Classic (Sparkling Cherry)';
            const imgSrc = isBlue ?
                'https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/Blue%20Soda.png' :
                'https://api.getlayers.ai/storage/v1/object/public/public/assets/soda-14ff8a788d/Green%20Soda.png';

            openModal(`
                <h2 class="modal-title">Order Diet Soda</h2>
                <p class="modal-subtitle">Freshly canned and delivered chilled to your doorstep with carbon-neutral shipping.</p>

                <div class="shop-preview-card">
                    <img src="${imgSrc}" class="shop-preview-img" alt="${flavorName}" />
                    <div>
                        <h4 style="font-size: 1.15rem; font-weight:700; color:white;">${flavorName}</h4>
                        <p style="font-size: 0.85rem; color: var(--muted-color); margin-top: 0.2rem;">330ml Can | 0 Sugar | 0 Calories</p>
                        <p style="font-size: 1.1rem; font-weight: 800; color: var(--pink-accent); margin-top: 0.4rem;" id="checkout-price">$14.99</p>
                    </div>
                </div>

                <div class="pack-selector">
                    <div class="pack-btn" data-pack="single" data-price="2.99" onclick="selectPack(this)">Single Can<br><span style="font-size:0.75rem; opacity:0.8;">$2.99</span></div>
                    <div class="pack-btn selected" data-pack="6pack" data-price="14.99" onclick="selectPack(this)">6-Pack<br><span style="font-size:0.75rem; opacity:0.8;">$14.99</span></div>
                    <div class="pack-btn" data-pack="12pack" data-price="26.99" onclick="selectPack(this)">12-Pack<br><span style="font-size:0.75rem; opacity:0.8;">$26.99</span></div>
                </div>

                <div class="qty-row">
                    <span style="font-weight:600; color:var(--muted-color);">Quantity</span>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="adjustQty(-1)">−</button>
                        <span id="qty-val" style="font-weight:700; min-width:20px; text-align:center;">1</span>
                        <button class="qty-btn" onclick="adjustQty(1)">+</button>
                    </div>
                </div>

                <button class="form-submit-btn" id="confirm-buy-btn" onclick="handleCheckout()">Complete Order • <span id="btn-total">$14.99</span></button>
            `);
        });

        let currentPricePerUnit = 14.99;
        let currentQuantity = 1;

        window.selectPack = function(el) {
            document.querySelectorAll('.pack-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            currentPricePerUnit = parseFloat(el.dataset.price);
            updateCheckoutTotal();
        };

        window.adjustQty = function(delta) {
            currentQuantity = Math.max(1, Math.min(20, currentQuantity + delta));
            const qtyElem = document.getElementById('qty-val');
            if (qtyElem) qtyElem.innerText = currentQuantity;
            updateCheckoutTotal();
        };

        function updateCheckoutTotal() {
            const total = (currentPricePerUnit * currentQuantity).toFixed(2);
            const priceElem = document.getElementById('checkout-price');
            const btnTotal = document.getElementById('btn-total');
            if (priceElem) priceElem.innerText = `$${total}`;
            if (btnTotal) btnTotal.innerText = `$${total}`;
        }

        window.handleCheckout = function() {
            closeModal();
            showToast(`Order confirmed! Thank you for ordering Diet Soda.`, "🎉");
        };

        // 6. AWARD BADGE MODAL
        awardBtn.addEventListener('click', () => {
            openModal(`
                <h2 class="modal-title">Design Awards 2025</h2>
                <p class="modal-subtitle">Winner of the International Beverage Design Excellence Trophy.</p>
                <div class="feature-grid">
                    <div class="feature-box">
                        <span class="feat-title">Gold Medal: Sustainable Form</span>
                        <span class="feat-desc">Awarded for 100% circular aluminum design with zero polymer coating.</span>
                    </div>
                    <div class="feature-box">
                        <span class="feat-title">Best Flavor Profile 2025</span>
                        <span class="feat-desc">Recognized by the Sommelier Guild for authentic botanical taste without sugar.</span>
                    </div>
                </div>
                <div style="text-align: center; margin-top: 1.5rem;">
                    <button class="form-submit-btn" style="width: auto; padding: 0.7rem 2.5rem;" onclick="closeModal()">Close</button>
                </div>
            `);
        });

        // 7. LOGO CLICK
        logoBtn.addEventListener('click', () => {
            closeModal();
            showToast("Pure Zero Refreshment • Enjoy!", "🥤");
        });
    </script>
</body>
</html>
